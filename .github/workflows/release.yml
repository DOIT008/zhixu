name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        shell: pwsh
        run: |
          $log = npm run build:win 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) {
            $errs = ($log -split "`n" | Where-Object { $_ -match 'error|ERR!|failed|Cannot|ENOENT|EACCES' } | Select-Object -Last 12) -join ' ;; '
            if (-not $errs) { $errs = ($log -split "`n" | Select-Object -Last 12) -join ' ;; ' }
            Write-Output "::error title=Build failed::$errs"
            exit $LASTEXITCODE
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
