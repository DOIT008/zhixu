name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        shell: pwsh
        run: |
          npm run build:win 2>&1 | Tee-Object -FilePath build-log.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Build failed - exit code $code"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content build-log.txt -Tail 120)
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            exit $code
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
